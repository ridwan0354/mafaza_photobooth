<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1800" width="600" height="1800">
  <!-- Photo Strip Background & Elegant Frame -->
  <rect width="600" height="1800" fill="#FFFBF5"/>
  <rect x="20" y="20" width="560" height="1760" fill="none" stroke="#D4AF37" stroke-width="4" rx="16"/>

  <!-- Event Header -->
  <text x="300" y="80" font-family="'Playfair Display', serif, sans-serif" font-size="28" font-weight="bold" fill="#333333" text-anchor="middle">
    DIMAS &amp; SARAH
  </text>
  <text x="300" y="105" font-family="'Inter', sans-serif" font-size="14" fill="#888888" letter-spacing="3" text-anchor="middle">
    THE WEDDING DAY
  </text>

  <!-- Green Chroma Slots for Poses 1, 2, and 3 (Color #00FF00) -->
  <!-- Pose 1 Slot -->
  <rect id="green_slot_1" x="50" y="130" width="500" height="420" fill="#00FF00" rx="8"/>

  <!-- Pose 2 Slot -->
  <rect id="green_slot_2" x="50" y="580" width="500" height="420" fill="#00FF00" rx="8"/>

  <!-- Pose 3 Slot -->
  <rect id="green_slot_3" x="50" y="1030" width="500" height="420" fill="#00FF00" rx="8"/>

  <!-- Decorative Separators & Details -->
  <circle cx="300" cy="1510" r="14" fill="#D4AF37"/>
  <text x="300" y="1515" font-family="sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">♥</text>

  <!-- Footer -->
  <text x="300" y="1600" font-family="'Playfair Display', serif, sans-serif" font-size="22" font-style="italic" fill="#555555" text-anchor="middle">
    Forever &amp; Always
  </text>
  <text x="300" y="1635" font-family="'Inter', sans-serif" font-size="16" fill="#888888" letter-spacing="2" text-anchor="middle">
    19 . 10 . 2026
  </text>
  <text x="300" y="1720" font-family="'Inter', sans-serif" font-size="11" fill="#BBBBBB" text-anchor="middle">
    Studio Keren Photo Booth • Epson High Definition Print
  </text>
</svg>
